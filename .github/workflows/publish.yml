name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # A release section promoted verbatim from a work log must not reach npm. Fail-closed
      # and dependency-free, so it runs before anything is installed, built or published.
      - name: Audit the released CHANGELOG section
        run: node scripts/check-changelog.mjs

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Verify the pushed tag matches the package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Resolve the npm dist-tag
        id: disttag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "$PKG_VERSION" in
            *-*) echo "tag=rc" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Node 22 bundles npm 10.x which lacks OIDC support for scoped packages.
      # Use npm 11.x for publish only. Remove once the runner bundles npm 11+.
      - name: Publish to npm
        run: npm exec --yes --package=npm@~11.5.1 -- npm publish --access public --tag ${{ steps.disttag.outputs.tag }}
