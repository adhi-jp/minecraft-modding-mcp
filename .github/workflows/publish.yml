name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      # Node 22 bundles npm 10.x which lacks OIDC support for scoped packages.
      # Use npm 11.x for publish only. Remove once the runner bundles npm 11+.
      - name: Publish to npm
        run: npm exec --yes --package=npm@~11.5.1 -- npm publish --no-git-checks --access public
