name: CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'README.md', 'CHANGELOG.md', 'docs/**', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', 'README.md', 'CHANGELOG.md', 'docs/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:coverage
